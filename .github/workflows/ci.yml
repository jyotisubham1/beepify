name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Check shell scripts exist
        run: |
          test -f mac/activate.sh
          test -f linux/activate.sh
          echo "✅ All core files present"
